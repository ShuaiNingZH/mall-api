spring:
  datasource:
    # 生产直接指向已经建好的 meet 数据库，不要空库地址
    url: jdbc:mysql://生产IP:3306/meet?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&zeroDateTimeBehavior=convertToNull
    username: 生产数据库账号
    password: 生产数据库密码
  sql:
    init:
      # 核心：生产禁止执行任何初始化SQL
      mode: never